<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Libya Mall</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f7f7f7;
direction:rtl;
}

/* HEADER */
.header{
background:white;
padding:10px;
text-align:center;
box-shadow:0 2px 5px rgba(0,0,0,0.05);
}
.header img{
height:40px;
}

/* SLIDER */
.slider{
display:flex;
overflow-x:auto;
scroll-snap-type:x mandatory;
gap:10px;
padding:10px;
}
.slider img{
width:90%;
border-radius:10px;
scroll-snap-align:center;
flex-shrink:0;
}

/* CONTAINER */
.container{
padding:15px;
background:white;
margin:10px;
border-radius:10px;
}

/* TITLE */
.title{
font-size:18px;
font-weight:bold;
margin-bottom:10px;
}

/* PRICE */
.price{
font-size:18px;
color:#0a7c4a;
font-weight:bold;
}
.offer{
color:red;
margin-bottom:15px;
}

/* FORM */
.form input,.form textarea{
width:100%;
padding:12px;
margin:6px 0;
border:1px solid #ddd;
border-radius:8px;
font-size:14px;
}

.btn{
width:100%;
background:#0a7c4a;
color:white;
padding:14px;
border:none;
border-radius:8px;
font-size:16px;
font-weight:bold;
}

/* DESC */
.short-desc{
text-align:center;
font-weight:bold;
margin:15px 0;
}

/* IMAGE */
.full{
width:100%;
border-radius:10px;
}

/* WHATSAPP */
.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
color:white;
font-size:20px;
padding:12px;
border-radius:50%;
text-decoration:none;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

/* MOBILE LIMIT */
@media(min-width:768px){
body{
max-width:400px;
margin:auto;
}
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
<img src="https://i.postimg.cc/kG08kSkX/Picsart-26-04-23-19-49-57-370.png">
</div>

<!-- SLIDER -->
<div class="slider">
<img src="https://i.postimg.cc/pX4rJ8jp/Chat-GPT-Image-Apr-23-2026-07-38-24-PM.png">
<img src="https://i.postimg.cc/Jn39y35f/FB-IMG-1776969011434.jpg">
<img src="https://i.postimg.cc/T1YHpzwY/FB-IMG-1776969017848.jpg">
<img src="https://i.postimg.cc/7ZTtGMx6/FB-IMG-1776969024453.jpg">
</div>

<!-- PRODUCT -->
<div class="container">

<div class="title">
🌿 صابونة سفن جرين المثلثة - علاج طبيعي لتساقط الشعر
</div>

<div class="price">169 دينار</div>
<div class="offer">🔥 عرض: قطعتين بـ 249 دينار</div>

<div class="form" id="formTop">
<input placeholder="الإسم">
<input placeholder="رقم الهاتف">
<textarea placeholder="العنوان"></textarea>
<button class="btn">اطلب الآن</button>
</div>

<div class="short-desc">
💚 الحل الطبيعي لتقوية الشعر وتقليل التساقط
</div>

<img class="full" src="https://piko.ma/cdn/shop/files/6570c7ea-1072-476d-aaa8-8ca01f56cf13.ipnoef1u0byfm8mndjdgqmatfztusoxhyg2jsfrg-1758817833_1758817834._1.gif?v=1767440514">

<img class="full" src="https://i.postimg.cc/26F4LG92/Gemini-Generated-Image-krmei7krmei7krme.png" onclick="goForm()">

</div>

<!-- FORM 2 -->
<div class="container">

<div class="title">🛒 أكمل طلبك الآن</div>

<div class="form">
<input placeholder="الإسم الكامل">
<input placeholder="رقم الهاتف">
<textarea placeholder="العنوان بالتفصيل"></textarea>
<button class="btn">تأكيد الطلب</button>
</div>

</div>

<!-- WHATSAPP -->
<a href="https://wa.me/212612136754" class="whatsapp">💬</a>

<script>
function goForm(){
document.getElementById("formTop").scrollIntoView({behavior:"smooth"});
}
</script>

</body>
</html>
