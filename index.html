<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Libya Mall</title>

<style>
body {
    margin:0;
    font-family: Arial;
    direction: rtl;
    background:#fff;
}

.header {
    text-align:center;
    padding:10px;
    background:#0a7c4a;
}
.header img {
    width:120px;
}

/* SLIDER */
.slider {
    display:flex;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
}
.slider img {
    width:100%;
    flex-shrink:0;
    scroll-snap-align:center;
}

/* CONTENT */
.container {
    padding:15px;
}

.title {
    font-size:20px;
    font-weight:bold;
    margin:10px 0;
}

.price {
    color:#0a7c4a;
    font-size:18px;
    font-weight:bold;
}

.offer {
    color:red;
    margin-bottom:10px;
}

.form input, .form textarea {
    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:6px;
    border:1px solid #ccc;
    font-size:14px;
}

.btn {
    width:100%;
    padding:14px;
    background:#0a7c4a;
    color:#fff;
    border:none;
    border-radius:6px;
    font-size:16px;
    font-weight:bold;
}

.short-desc {
    text-align:center;
    font-weight:bold;
    margin:15px 0;
}

.gif {
    width:100%;
}

.long-img {
    width:100%;
    margin-top:10px;
    cursor:pointer;
}

/* WHATSAPP */
.whatsapp {
    position:fixed;
    bottom:15px;
    right:15px;
    background:#25D366;
    color:white;
    font-size:22px;
    padding:12px;
    border-radius:50%;
    text-decoration:none;
}

/* MOBILE OPT */
@media(min-width:768px){
    body{
        max-width:400px;
        margin:auto;
        border:1px solid #eee;
    }
}
</style>

</head>

<body>

<!-- HEADER -->
<div class="header">
<img src="https://i.postimg.cc/kG08kSkX/Picsart-26-04-23-19-49-57-370.png">
</div>

<!-- SLIDER -->
<div class="slider">
<img src="https://i.postimg.cc/pX4rJ8jp/Chat-GPT-Image-Apr-23-2026-07-38-24-PM.png">
<img src="https://i.postimg.cc/Jn39y35f/FB-IMG-1776969011434.jpg">
<img src="https://i.postimg.cc/T1YHpzwY/FB-IMG-1776969017848.jpg">
<img src="https://i.postimg.cc/7ZTtGMx6/FB-IMG-1776969024453.jpg">
</div>

<div class="container">

<!-- TITLE -->
<div class="title">
🌿 صابونة سفن جرين المثلثة - علاج طبيعي لتساقط الشعر
</div>

<!-- PRICE -->
<div class="price">169 دينار للقطعة</div>
<div class="offer">🔥 عرض خاص: قطعتين بـ 249 دينار</div>

<!-- FORM 1 -->
<div class="form" id="orderForm">
<input type="text" placeholder="الإسم">
<input type="text" placeholder="رقم الهاتف">
<textarea placeholder="العنوان"></textarea>
<button class="btn">اطلب الآن</button>
</div>

<!-- SHORT DESC -->
<div class="short-desc">
💚 الحل الطبيعي لتقوية الشعر وتقليل التساقط بسرعة!
</div>

<!-- GIF -->
<img class="gif" src="https://piko.ma/cdn/shop/files/6570c7ea-1072-476d-aaa8-8ca01f56cf13.ipnoef1u0byfm8mndjdgqmatfztusoxhyg2jsfrg-1758817833_1758817834._1.gif?v=1767440514">

<!-- LONG IMAGE -->
<img class="long-img" src="https://i.postimg.cc/26F4LG92/Gemini-Generated-Image-krmei7krmei7krme.png" onclick="scrollToForm()">

<!-- FORM 2 -->
<div class="form">
<input type="text" placeholder="الإسم الكامل">
<input type="text" placeholder="رقم الهاتف">
<textarea placeholder="العنوان بالتفصيل"></textarea>
<button class="btn">تأكيد الطلب الآن</button>
</div>

</div>

<!-- WHATSAPP -->
<a href="https://wa.me/212612136754" class="whatsapp">💬</a>

<script>
function scrollToForm() {
    document.getElementById("orderForm").scrollIntoView({behavior:"smooth"});
}
</script>

</body>
</html>
