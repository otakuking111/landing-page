<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Libya Mall - سفن جرين</title>
    <style>
        :root {
            --primary: #2d5a27;
            --accent: #d32f2f;
            --bg-light: #f4f7f4;
            --shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fff;
            color: #333;
            overflow-x: hidden;
        }

        /* شريط التوصيل المجاني */
        .free-shipping-bar {
            background-color: var(--primary);
            color: white;
            text-align: center;
            padding: 12px 5px;
            font-weight: bold;
            font-size: 15px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* سلايدر الصور الاحترافي */
        .slider-container {
            position: relative;
            width: 100%;
            background: #f9f9f9;
        }

        .slider {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory; /* لجعل الصورة تقف في المنتصف */
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            /* عكس اتجاه التمرير */
            direction: ltr; 
        }

        .slider::-webkit-scrollbar { display: none; }

        .slider img {
            width: 100vw;
            height: auto;
            flex-shrink: 0;
            scroll-snap-align: start;
            object-fit: contain;
        }

        /* نقاط التمرير السفلى */
        .slider-dots {
            display: flex;
            justify-content: center;
            gap: 5px;
            padding: 10px 0;
        }
        .dot { width: 8px; height: 8px; background: #ddd; border-radius: 50%; }
        .dot.active { background: var(--primary); width: 20px; border-radius: 10px; }

        /* تفاصيل المنتج */
        .product-header {
            padding: 15px;
            text-align: center;
        }
        .product-title {
            font-size: 20px;
            color: var(--primary);
            font-weight: 900;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .pricing-grid {
            display: flex;
            gap: 10px;
            padding: 0 5px;
        }
        .price-item {
            flex: 1;
            padding: 15px 5px;
            border-radius: 15px;
            border: 1px solid #eee;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .price-item.best {
            border: 2px solid #fbc02d;
            background: #fffef2;
            transform: scale(1.05);
        }
        .price-item span { color: var(--accent); font-weight: bold; font-size: 19px; }

        /* نموذج الطلب المطور */
        .order-card {
            background: #fff;
            margin: 20px 15px;
            padding: 20px;
            border-radius: 20px;
            box-shadow: var(--shadow);
        }
        
        input, select {
            width: 100%;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            box-sizing: border-box;
            background: #fdfdfd;
        }

        .order-btn {
            width: 100%;
            padding: 18px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(45,90,39,0.3);
        }

        .gif-container img, .landing-long-img img {
            width: 100%;
            height: auto;
            display: block;
        }

        .whatsapp-btn {
            position: fixed;
            bottom: 25px;
            right: 20px;
            width: 55px;
            height: 55px;
            background: #25d366;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 999;
        }
        .whatsapp-btn img { width: 30px; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
        .pulse { animation: pulse 2s infinite; }

    </style>
</head>
<body>

    <div class="free-shipping-bar">
        🚚 توصيل مجاني لكل مدن ليبيا - الدفع عند الاستلام
    </div>

    <div class="slider-container">
        <div class="slider">
            <img src="https://lh3.googleusercontent.com/d/1EyhR79hLJOJdlrRxNVAMzVrTbXn59oqn" alt="الصورة الرئيسية">
            <img src="https://i.postimg.cc/Jn39y35f/FB-IMG-1776969011434.jpg">
            <img src="https://i.postimg.cc/T1YHpzwY/FB-IMG-1776969017848.jpg">
            <img src="https://i.postimg.cc/7ZTtGMx6/FB-IMG-1776969024453.jpg">
        </div>
        <div class="slider-dots">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <div class="product-header">
        <div class="product-title">🌿 صـابونة سـفن جـرين المثلثة <br> الخيار الأول لعلاج تساقط الشعر 🌿</div>
        <div class="pricing-grid">
            <div class="price-item">
                <small>قطعة واحدة</small><br>
                <strong>169 د.ل</strong>
            </div>
            <div class="price-item best">
                <small>قطعتين (توفير)</small><br>
                <span>249 د.ل</span>
            </div>
        </div>
    </div>

    <div id="order" class="order-card">
        <div style="text-align: center; margin-bottom: 15px; font-weight: bold;">طلب سريع 👇</div>
        <form>
            <input type="text" placeholder="الإسم بالكامل" required>
            <input type="tel" placeholder="رقم الهاتف" required>
            <input type="text" placeholder="المدينة والمنطقة" required>
            <select required>
                <option value="2">عرض التوفير: قطعتين بـ 249 د.ل</option>
                <option value="1">قطعة واحدة بـ 169 د.ل</option>
            </select>
            <button type="submit" class="order-btn pulse">تأكيد الطلب الآن</button>
        </form>
    </div>

    <div class="gif-container">
        <img src="https://piko.ma/cdn/shop/files/6570c7ea-1072-476d-aaa8-8ca01f56cf13.ipnoef1u0byfm8mndjdgqmatfztusoxhyg2jsfrg-1758817833_1758817834._1.gif?v=1767440514">
    </div>

    <div class="landing-long-img">
        <img src="https://lh3.googleusercontent.com/d/1oT_WSgVmu6-JqYTP5D6_QTQriOCvgoiA" alt="تفاصيل المنتج">
    </div>

    <div class="order-card" style="border: 2px solid var(--primary);">
        <div style="text-align: center; color: var(--primary); font-weight: bold; margin-bottom: 15px;">أكمل بياناتك للحصول على الشحن المجاني 🛒</div>
        <form>
            <input type="text" placeholder="الإسم" required>
            <input type="tel" placeholder="رقم الهاتف" required>
            <input type="text" placeholder="العنوان" required>
            <button type="submit" class="order-btn" style="background: var(--accent);">اطلب الآن 🚚</button>
        </form>
    </div>

    <div style="text-align: center; padding: 20px; color: #bbb; font-size: 11px;">
        Libya Mall © 2026 - جميع الحقوق محفوظة
    </div>

    <a href="https://wa.me/212612136754" class="whatsapp-btn" target="_blank">
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg">
    </a>

    <script>
        // كود بسيط لتحديث النقاط عند السكرول في السلايدر
        const slider = document.querySelector('.slider');
        const dots = document.querySelectorAll('.dot');
        
        slider.addEventListener('scroll', () => {
            const index = Math.round(slider.scrollLeft / window.innerWidth);
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === index);
            });
        });
    </script>
</body>
</html>
