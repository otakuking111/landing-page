<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Libya Mall - سفن جرين</title>
    <style>
        :root {
            --primary: #2d5a27;
            --accent: #d32f2f;
            --bg-light: #f4f7f4;
            --shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fff;
            color: #333;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        .free-shipping-bar {
            background-color: var(--primary);
            color: white;
            text-align: center;
            padding: 12px 5px;
            font-weight: bold;
            font-size: 15px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* إصلاح السلايدر ليكون احترافياً */
        .slider-container {
            width: 100%;
            overflow: hidden;
            background: #fff;
            position: relative;
        }

        .slider {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            direction: rtl; /* اتجاه التمرير العربي */
        }

        .slider::-webkit-scrollbar { display: none; }

        .slider img {
            width: 100%;
            flex-shrink: 0;
            scroll-snap-align: center; /* تثبيت الصورة في المنتصف */
            object-fit: cover;
        }

        /* تفاصيل المنتج */
        .product-header {
            padding: 20px 15px;
            text-align: center;
        }
        .product-title {
            font-size: 22px;
            color: var(--primary);
            font-weight: 900;
            margin-bottom: 15px;
        }

        .pricing-grid {
            display: flex;
            gap: 10px;
            padding: 0 10px;
        }
        .price-item {
            flex: 1;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #ddd;
            background: #fff;
        }
        .price-item.best {
            border: 2px solid #fbc02d;
            background: #fffef2;
            transform: scale(1.05);
        }
        .price-item span { color: var(--accent); font-weight: bold; font-size: 20px; }

        /* توحيد تصميم خانة المعلومات */
        .order-card {
            background: #fff;
            margin: 25px 15px;
            padding: 25px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            border: 1px solid #eee;
        }
        
        .form-title {
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 18px;
            color: var(--primary);
        }

        input, select {
            width: 100%;
            padding: 15px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            box-sizing: border-box;
            background: #fafafa;
        }

        .order-btn {
            width: 100%;
            padding: 18px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .landing-long-img {
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }
        .landing-long-img img {
            width: 100%;
            display: block;
        }

        .whatsapp-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: #25d366;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .pulse { animation: pulse 2s infinite; }

    </style>
</head>
<body>

    <div class="free-shipping-bar">
        🚚 توصيل مجاني لكل مدن ليبيا
    </div>

    <div class="slider-container">
        <div class="slider">
            <img src="https://i.postimg.cc/Jn39y35f/FB-IMG-1776969011434.jpg">
            <img src="https://i.postimg.cc/T1YHpzwY/FB-IMG-1776969017848.jpg">
            <img src="https://i.postimg.cc/7ZTtGMx6/FB-IMG-1776969024453.jpg">
        </div>
    </div>

    <div class="product-header">
        <div class="product-title">🌿 صـابونة سـفن جـرين المثلثة - علاج طبيعي لتساقط الشعر 🌿</div>
        <div class="pricing-grid">
            <div class="price-item">
                <small>قطعة واحدة</small><br>
                <strong>169 د.ل</strong>
            </div>
            <div class="price-item best">
                <small>قطعتين (توفير)</small><br>
                <span>249 د.ل</span>
            </div>
        </div>
    </div>

    <div id="order-form-top" class="order-card">
        <div class="form-title">احجز طلبك الآن بتعبئة البيانات التالية 👇</div>
        <form>
            <input type="text" placeholder="الإسم الكامل" required>
            <input type="tel" placeholder="رقم الهاتف" required>
            <input type="text" placeholder="عنوان التوصيل (المدينة والحي)" required>
            <select required>
                <option value="2">قطعتين بـ 249 دينار (عرض التوفير)</option>
                <option value="1">قطعة واحدة بـ 169 دينار</option>
            </select>
            <button type="submit" class="order-btn pulse">تأكيد الطلب - دفع عند الاستلام</button>
        </form>
    </div>

    <div style="width: 100%;">
        <img src="https://piko.ma/cdn/shop/files/6570c7ea-1072-476d-aaa8-8ca01f56cf13.ipnoef1u0byfm8mndjdgqmatfztusoxhyg2jsfrg-1758817833_1758817834._1.gif?v=1767440514" style="width: 100%;">
    </div>

    <div class="landing-long-img" onclick="document.getElementById('order-form-top').scrollIntoView();">
        <img src="https://i.postimg.cc/Jn39y35f/FB-IMG-1776969011434.jpg" alt="اضغط للطلب">
    </div>

    <div class="order-card">
        <div class="form-title">أكمل الطلب الآن للحصول على التوصيل المجاني 🛒</div>
        <form>
            <input type="text" placeholder="الإسم الكامل" required>
            <input type="tel" placeholder="رقم الهاتف" required>
            <input type="text" placeholder="عنوان التوصيل بالتفصيل" required>
            <select required>
                <option value="2">قطعتين بـ 249 دينار (عرض التوفير)</option>
                <option value="1">قطعة واحدة بـ 169 دينار</option>
            </select>
            <button type="submit" class="order-btn" style="background: var(--accent);">اطلب الآن مجاناً 🚚</button>
        </form>
    </div>

    <div style="text-align: center; padding: 30px; color: #888; font-size: 12px;">
        كل الحقوق محفوظة لمتجر Libya Mall © 2026
    </div>

    <a href="https://wa.me/212612136754" class="whatsapp-btn" target="_blank">
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" width="35">
    </a>

</body>
</html>
