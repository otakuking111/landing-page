<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Libya Mall</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #fff;
    direction: rtl;
}

.header {
    text-align: center;
    padding: 10px;
    background: #0a7c4a;
}
.header img {
    width: 120px;
}

.slider {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
}
.slider img {
    width: 100%;
    flex-shrink: 0;
    scroll-snap-align: center;
}

.container {
    padding: 15px;
}

.title {
    font-size: 20px;
    font-weight: bold;
    margin: 10px 0;
}

.price {
    color: green;
    font-size: 18px;
    margin-bottom: 10px;
}

.form input, .form textarea {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

.btn {
    background: #0a7c4a;
    color: white;
    padding: 12px;
    border: none;
    width: 100%;
    font-size: 16px;
    border-radius: 5px;
}

.short-desc {
    margin: 15px 0;
    font-weight: bold;
    text-align: center;
}

.long-img {
    width: 100%;
    cursor: pointer;
}

.whatsapp {
    position: fixed;
    bottom: 15px;
    right: 15px;
    background: #25D366;
    color: white;
    padding: 12px;
    border-radius: 50%;
    font-size: 20px;
}
</style>
</head>

<body>

<div class="header">
<img src="https://postimg.cc/GTjHD4LZ">
</div>

<div class="slider">
<img src="https://postimg.cc/jCRqwdfS">
<img src="https://postimg.cc/47d8q9MP">
<img src="https://postimg.cc/njg1WwB6">
<img src="https://postimg.cc/sMs4bWGd">
</div>

<div class="container">

<div class="title">
🌿 صابونة سفن جرين المثلثة - علاج طبيعي لتساقط الشعر
</div>

<div class="price">
💰 169 دينار للقطعة <br>
🔥 عرض خاص: قطعتين بـ 249 دينار
</div>

<div class="form" id="orderForm">
<input type="text" placeholder="الإسم">
<input type="text" placeholder="رقم الهاتف">
<textarea placeholder="العنوان"></textarea>
<button class="btn">اطلب الآن</button>
</div>

<div class="short-desc">
💚 الحل الطبيعي لتقوية الشعر وإيقاف التساقط بسرعة!
</div>

<img src="https://piko.ma/cdn/shop/files/6570c7ea-1072-476d-aaa8-8ca01f56cf13.ipnoef1u0byfm8mndjdgqmatfztusoxhyg2jsfrg-1758817833_1758817834._1.gif?v=1767440514" style="width:100%;">

<img src="https://postimg.cc/G8tBZFCy" class="long-img" onclick="scrollToForm()">

<div class="form">
<input type="text" placeholder="الإسم">
<input type="text" placeholder="رقم الهاتف">
<textarea placeholder="العنوان"></textarea>
<button class="btn">تأكيد الطلب</button>
</div>

</div>

<a href="https://wa.me/212612136754" class="whatsapp">💬</a>

<script>
function scrollToForm() {
    document.getElementById("orderForm").scrollIntoView({behavior: "smooth"});
}
</script>

</body>
</html>
